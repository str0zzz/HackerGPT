name: Build HackerGPT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          pip install flet==0.27.1 groq==0.19.0 pypdf2 python-docx pillow python-dotenv
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
          
      - name: Build APK
        run: |
          pip install flet-cli
          flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerGPT
          path: build/apk/
