name: Build HackerGPT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          pip install flet==0.27.1 groq==0.19.0 pypdf2 python-docx pillow python-dotenv flet-cli
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.6'
          channel: 'stable'

      - name: Build APK
        env:
          # Force the path so Flet doesn't download 3.27.4
          FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable-3.22.6-x64/flutter
        run: |
          # 1. Clean build directory
          rm -rf build/
          
          # 2. Accept licenses
          yes | sdkmanager --licenses || true
          
          # 3. Force Flet to build using the currently installed flutter version
          flet build apk --module-name hackergpt_app
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerGPT
          path: build/apk/
