name: Build HackerGPT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Build APK
        run: |
          # Install CLI globally
          pip install flet-cli
          
          # Clean old builds
          rm -rf build/
          
          # Accept licenses
          yes | sdkmanager --licenses || true
          
          # Build with --no-venv to avoid dependency resolution conflicts
          flet build apk --module-name hackergpt_app --no-venv
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerGPT
          path: build/apk/
