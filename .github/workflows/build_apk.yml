name: Build HackerGPT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # Removing the strict version pin allows pip to grab the latest compatible release
          pip install flet groq==0.19.0 pypdf2 python-docx pillow python-dotenv flet-cli
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2' # Upgraded to a version matching the package requirements
          channel: 'stable'

      - name: Build APK
        env:
          # Tells Flet exactly where to look for the correct Flutter SDK
          FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable-3.29.2-x64/flutter
        run: |
          rm -rf build/
          yes | sdkmanager --licenses || true
          flet build apk --module-name hackergpt_app
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerGPT
          path: build/apk/
