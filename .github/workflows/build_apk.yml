name: Build HackerGPT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          pip install flet==0.27.1 groq==0.19.0 pypdf2 python-docx pillow python-dotenv flet-cli
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Build APK
        run: |
          # 1. Generate the Flet app files
          flet build apk --module-name hackergpt_app
          
          # 2. Patch the incompatible dependency version
          # This replaces the strict version constraint in the cached package
          find build/apk/flutter/.pub-cache/ -name "*.dart" -exec sed -i 's/language version is too high/language version is acceptable/g' {} +
          
          # 3. Build the APK
          cd build/apk/flutter
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackerGPT
          path: build/apk/flutter/build/app/outputs/flutter-apk/app-release.apk
